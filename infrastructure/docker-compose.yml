services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: verificert
      POSTGRES_PASSWORD: verificert
      POSTGRES_DB: verificert
    ports:
      - "5432:5432"
    volumes:
      - verificert_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verificert"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://verificert:verificert@postgres:5432/verificert
      BLOCKCHAIN_RPC_URL: http://host.docker.internal:8545
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - verificert_storage:/app/storage

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  verificert_pg:
  verificert_storage:
